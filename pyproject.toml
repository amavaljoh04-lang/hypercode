[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercode"
version = "0.1.0"
description = "HyperCode - Agent de développement autonome surpassant OpenCode/OpenHands/Hermes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "HyperCode Team"}]

dependencies = [
    "rich>=13.7",
    "textual>=0.50",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "pygments>=2.17",
    "websockets>=12.0",
    "aiofiles>=23.2",
    "pathspec>=0.12",
]

[project.scripts]
hypercode = "hypercode.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["hypercode*"]
